name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build + publish (PyPI)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/golpo-mcp
    permissions:
      id-token: write  # OIDC trusted publishing — no PyPI token required
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # A release that cannot start never reaches PyPI.
      - name: Smoke-test the README install line (uvx golpo-mcp)
        run: |
          python -m pip install --quiet uv pytest
          GOLPO_MCP_SMOKE_CMD="uvx --no-cache --from $(ls dist/*.whl) golpo-mcp" \
            python -m pytest -v tests/test_install.py -k stdio

      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
