name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Compile-check sources
        run: |
          python -m py_compile src/golpo_mcp/__init__.py \
                               src/golpo_mcp/__main__.py \
                               src/golpo_mcp/auth.py \
                               src/golpo_mcp/client.py \
                               src/golpo_mcp/downloads.py \
                               src/golpo_mcp/server.py

      - name: Run pytest
        run: pytest -v

      - name: Build wheel + sdist
        run: |
          pip install --quiet build
          python -m build

      - name: List built artifacts
        run: ls -la dist/

      # The README's install line, run on the wheel just built: uvx resolves the
      # newest dependencies allowed, as it does for users, then the test does the
      # MCP handshake (initialize + tools/list) over stdio.
      - name: Smoke-test the README install line (uvx golpo-mcp)
        run: |
          pip install --quiet uv
          GOLPO_MCP_SMOKE_CMD="uvx --no-cache --from $(ls dist/*.whl) golpo-mcp" \
            pytest -v tests/test_install.py -k stdio
