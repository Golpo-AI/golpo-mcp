[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golpo-mcp"
dynamic = ["version"]
description = "Model Context Protocol server for the Golpo AI video API. Generate, list, and download Golpo videos from any MCP-compatible client (Claude Desktop, Claude Code, Cursor, Continue, Zed, …)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Golpo AI", email = "founders@golpoai.com" },
]
keywords = ["mcp", "model-context-protocol", "golpo", "video", "ai-video", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://video.golpoai.com"
Repository = "https://github.com/Golpo-AI/golpo-mcp"
Documentation = "https://github.com/Golpo-AI/golpo-mcp#readme"
Issues = "https://github.com/Golpo-AI/golpo-mcp/issues"

[project.scripts]
golpo-mcp = "golpo_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
]

[tool.hatch.version]
path = "src/golpo_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/golpo_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
